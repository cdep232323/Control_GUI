name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  QT_VERSION: 6.5.3

jobs:
  build-msvc:
    name: Build MSVC
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ runner.os }}

    - uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2019_64
        cache: true
        dir: ${{ github.workspace }}

    - uses: ilammy/msvc-dev-cmd@v1

    - name: Build MQTT Module
      run: |
        git clone https://code.qt.io/qt/qtmqtt.git
        cd qtmqtt
        git checkout 6.5
        mkdir build
        cd build
        cmake .. -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DQT_NO_PACKAGE_VERSION_CHECK=TRUE
        cmake --build . --config Release
        
        New-Item -ItemType Directory -Force -Path "${{ env.QT_ROOT_DIR }}\bin"
        New-Item -ItemType Directory -Force -Path "${{ env.QT_ROOT_DIR }}\lib"
        New-Item -ItemType Directory -Force -Path "${{ env.QT_ROOT_DIR }}\include\QtMqtt"
        New-Item -ItemType Directory -Force -Path "${{ env.QT_ROOT_DIR }}\include\QtMqtt\QtMqtt"
        New-Item -ItemType Directory -Force -Path "${{ env.QT_ROOT_DIR }}\mkspecs\modules"
        
        Copy-Item bin\Qt6Mqtt.dll -Destination "${{ env.QT_ROOT_DIR }}\bin\" -Force
        Copy-Item lib\Qt6Mqtt.lib -Destination "${{ env.QT_ROOT_DIR }}\lib\" -Force
        Copy-Item ..\src\mqtt\*.h -Destination "${{ env.QT_ROOT_DIR }}\include\QtMqtt\" -Force
        
        cd ..
        cd ..

    - name: Create MQTT exports header
      run: |
        @"
        #ifndef QTMQTTEXPORTS_H
        #define QTMQTTEXPORTS_H

        #include <QtCore/qglobal.h>

        #if defined(QT_SHARED) || !defined(QT_STATIC)
        #  if defined(QT_BUILD_MQTT_LIB)
        #    define Q_MQTT_EXPORT Q_DECL_EXPORT
        #  else
        #    define Q_MQTT_EXPORT Q_DECL_IMPORT
        #  endif
        #else
        #  define Q_MQTT_EXPORT
        #endif

        #ifdef BUILD_STATIC
        #  define QTMQTT_EXPORT
        #  define QTMQTT_NO_EXPORT
        #else
        #  define QTMQTT_EXPORT Q_DECL_EXPORT
        #  define QTMQTT_NO_EXPORT Q_DECL_HIDDEN
        #endif

        #endif // QTMQTTEXPORTS_H
        "@ | Out-File -FilePath "${{ env.QT_ROOT_DIR }}\include\QtMqtt\QtMqtt\qtmqttexports.h" -Encoding ascii

    - name: Create MQTT module PRIs
      run: |
        @"
        QT.mqtt.VERSION = ${{ env.QT_VERSION }}
        QT.mqtt.name = QtMqtt
        QT.mqtt.module = Qt6Mqtt
        QT.mqtt.libs = $$QT_MODULE_LIB_BASE
        QT.mqtt.includes = $$QT_MODULE_INCLUDE_BASE $$QT_MODULE_INCLUDE_BASE/QtMqtt
        QT.mqtt.frameworks =
        QT.mqtt.bins = $$QT_MODULE_BIN_BASE
        QT.mqtt.depends = core network
        QT.mqtt.uses =
        QT.mqtt.module_config = v2
        QT.mqtt.DEFINES = QT_MQTT_LIB
        QT.mqtt.enabled_features =
        QT.mqtt.disabled_features =
        QT_MODULES += mqtt
        "@ | Out-File -FilePath "${{ env.QT_ROOT_DIR }}\mkspecs\modules\qt_lib_mqtt.pri" -Encoding ascii

    # Build with qmake instead of CMake for simplicity
    - name: Build with qmake
      shell: cmd
      run: |
        mkdir build-qmake
        cd build-qmake
        echo QT += core gui widgets network printsupport > app.pro
        echo CONFIG += c++17 >> app.pro
        echo TARGET = Control_GUI >> app.pro
        echo TEMPLATE = app >> app.pro
        echo SOURCES += ..\main.cpp ..\gui.cpp >> app.pro
        echo HEADERS += ..\gui.h >> app.pro
        echo FORMS += ..\gui.ui >> app.pro
        echo INCLUDEPATH += ${{ env.QT_ROOT_DIR }}/include/QtMqtt >> app.pro
        echo LIBS += -L${{ env.QT_ROOT_DIR }}/lib -lQt6Mqtt >> app.pro
        echo INCLUDEPATH += ..\thirdparty\qcustomplot >> app.pro
        echo SOURCES += ..\thirdparty\qcustomplot\qcustomplot.cpp >> app.pro
        echo HEADERS += ..\thirdparty\qcustomplot\qcustomplot.h >> app.pro
        echo INCLUDEPATH += ..\thirdparty\qcgaugewidget\source >> app.pro
        echo SOURCES += ..\thirdparty\qcgaugewidget\source\qcgaugewidget.cpp >> app.pro
        echo HEADERS += ..\thirdparty\qcgaugewidget\source\qcgaugewidget.h >> app.pro
        echo INCLUDEPATH += ..\thirdparty\picojson >> app.pro
        echo RESOURCES += ..\icons\icons.qrc >> app.pro
        ${{ env.QT_ROOT_DIR }}\bin\qmake.exe app.pro CONFIG+=release
        if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
        nmake
        if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

    - name: Create standalone package
      shell: cmd
      run: |
        cd build-qmake\release
        ${{ env.QT_ROOT_DIR }}\bin\windeployqt.exe --release --no-translations Control_GUI.exe
        copy ${{ env.QT_ROOT_DIR }}\bin\Qt6Mqtt.dll .
        copy ..\..\config.json .
        powershell Compress-Archive -Path * -DestinationPath ..\..\Control_GUI-standalone.zip

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-msvc-mqtt-qt
        path: Control_GUI-standalone.zip

    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: msvc-build-failed
        path: build-qmake

  build-ubuntu:
    name: Build Ubuntu
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
    
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ runner.os }}
    
      - name: Install Qt6 from PPAs
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository ppa:beineri/opt-qt-${{ env.QT_VERSION }}-focal -y
          sudo apt-get update
          sudo apt-get install -y qt${{ env.QT_VERSION/.*/}}-full ninja-build cmake git libxkbcommon-dev libxcb-cursor0 imagemagick
          
      # Set up Qt environment variables
      - name: Set up Qt environment
        run: |
          echo "/opt/qt${{ env.QT_VERSION/.*/}}/bin" >> $GITHUB_PATH
          echo "QT_ROOT_DIR=/opt/qt${{ env.QT_VERSION/.*/}}" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/opt/qt${{ env.QT_VERSION/.*/}}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=/opt/qt${{ env.QT_VERSION/.*/}}/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
      
      - name: Build MQTT Module
        run: |
          git clone https://code.qt.io/qt/qtmqtt.git
          cd qtmqtt
          git checkout 6.5
          mkdir build
          cd build
          
          # Source Qt environment
          source /opt/qt${{ env.QT_VERSION/.*/}}/bin/qt${{ env.QT_VERSION/.*/}}-env.sh
          
          cmake .. -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DQT_NO_PACKAGE_VERSION_CHECK=TRUE
          cmake --build . --config Release
          
          # Create the necessary directory structure
          sudo mkdir -p "${{ env.QT_ROOT_DIR }}/lib"
          sudo mkdir -p "${{ env.QT_ROOT_DIR }}/include/QtMqtt"
          sudo mkdir -p "${{ env.QT_ROOT_DIR }}/mkspecs/modules"
          
          # Install the MQTT library
          sudo cp lib/libQt6Mqtt.so* "${{ env.QT_ROOT_DIR }}/lib/"
          
          # Install all MQTT headers to the include directory
          sudo cp -r ../src/mqtt/*.h "${{ env.QT_ROOT_DIR }}/include/QtMqtt/"
          
          cd ..
          cd ..

      - name: Create MQTT exports header
        run: |
          # Create the directory structure that matches how Qt headers are referenced
          sudo mkdir -p "${{ env.QT_ROOT_DIR }}/include/QtMqtt"
          
          # Create the exports header directly in the QtMqtt include directory
          cat << EOF | sudo tee "${{ env.QT_ROOT_DIR }}/include/QtMqtt/qtmqttexports.h"
          #ifndef QTMQTTEXPORTS_H
          #define QTMQTTEXPORTS_H

          #include <QtCore/qglobal.h>

          #if defined(QT_SHARED) || !defined(QT_STATIC)
          #  if defined(QT_BUILD_MQTT_LIB)
          #    define Q_MQTT_EXPORT Q_DECL_EXPORT
          #  else
          #    define Q_MQTT_EXPORT Q_DECL_IMPORT
          #  endif
          #else
          #  define Q_MQTT_EXPORT
          #endif

          #ifdef BUILD_STATIC
          #  define QTMQTT_EXPORT
          #  define QTMQTT_NO_EXPORT
          #else
          #  define QTMQTT_EXPORT Q_DECL_EXPORT
          #  define QTMQTT_NO_EXPORT Q_DECL_HIDDEN
          #endif

          #endif // QTMQTTEXPORTS_H
          EOF
          
          # Create a symlink for the header within the module-specific subdirectory
          sudo mkdir -p "${{ env.QT_ROOT_DIR }}/include/QtMqtt/QtMqtt"
          sudo ln -sf "${{ env.QT_ROOT_DIR }}/include/QtMqtt/qtmqttexports.h" "${{ env.QT_ROOT_DIR }}/include/QtMqtt/QtMqtt/qtmqttexports.h"

      - name: Create MQTT module PRIs
        run: |
          cat << EOF | sudo tee "${{ env.QT_ROOT_DIR }}/mkspecs/modules/qt_lib_mqtt.pri"
          QT.mqtt.VERSION = ${{ env.QT_VERSION }}
          QT.mqtt.name = QtMqtt
          QT.mqtt.module = Qt6Mqtt
          QT.mqtt.libs = \$\$QT_MODULE_LIB_BASE
          QT.mqtt.includes = \$\$QT_MODULE_INCLUDE_BASE \$\$QT_MODULE_INCLUDE_BASE/QtMqtt
          QT.mqtt.frameworks =
          QT.mqtt.bins = \$\$QT_MODULE_BIN_BASE
          QT.mqtt.depends = core network
          QT.mqtt.uses =
          QT.mqtt.module_config = v2
          QT.mqtt.DEFINES = QT_MQTT_LIB
          QT.mqtt.enabled_features =
          QT.mqtt.disabled_features =
          QT_MODULES += mqtt
          EOF

      # Configure CMake with compatibility flags
      - name: Configure CMake
        run: |
          # Source Qt environment
          source /opt/qt${{ env.QT_VERSION/.*/}}/bin/qt${{ env.QT_VERSION/.*/}}-env.sh
          
          # Run CMake with compatibility flags
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" \
            -DBUILD_MQTT_LOCALLY=OFF \
            -DCMAKE_CXX_FLAGS="-D_GLIBCXX_USE_CXX11_ABI=0" \
            -DCMAKE_VERBOSE_MAKEFILE=ON
        
      - name: Build project
        run: |
          # Source Qt environment
          source /opt/qt${{ env.QT_VERSION/.*/}}/bin/qt${{ env.QT_VERSION/.*/}}-env.sh
          
          cmake --build build
    
      # Create a fully standalone package with all dependencies
      - name: Create complete standalone package
        run: |
          cd build
          mkdir -p appdir/usr/bin
          mkdir -p appdir/usr/lib
          mkdir -p appdir/usr/share/applications
          mkdir -p appdir/usr/share/icons/hicolor/256x256/apps
          
          # Copy application binary
          cp Control_GUI appdir/usr/bin/
          cp ../config.json appdir/usr/bin/
          
          # Copy Qt and system libraries
          cp ${{ env.QT_ROOT_DIR }}/lib/libQt6Mqtt.so* appdir/usr/lib/
          cp ${{ env.QT_ROOT_DIR }}/lib/libQt6Core.so* appdir/usr/lib/
          cp ${{ env.QT_ROOT_DIR }}/lib/libQt6Gui.so* appdir/usr/lib/
          cp ${{ env.QT_ROOT_DIR }}/lib/libQt6Widgets.so* appdir/usr/lib/
          cp ${{ env.QT_ROOT_DIR }}/lib/libQt6Network.so* appdir/usr/lib/
          cp ${{ env.QT_ROOT_DIR }}/lib/libQt6PrintSupport.so* appdir/usr/lib/
          cp ${{ env.QT_ROOT_DIR }}/lib/libicui18n.so* appdir/usr/lib/ || echo "libicui18n not found"
          cp ${{ env.QT_ROOT_DIR }}/lib/libicuuc.so* appdir/usr/lib/ || echo "libicuuc not found"
          cp ${{ env.QT_ROOT_DIR }}/lib/libicudata.so* appdir/usr/lib/ || echo "libicudata not found"
          
          # Copy additional system libraries that might be needed
          cp /usr/lib/x86_64-linux-gnu/libstdc++.so.6 appdir/usr/lib/ || echo "libstdc++ not found"
          cp /usr/lib/x86_64-linux-gnu/libgcc_s.so.1 appdir/usr/lib/ || echo "libgcc_s not found"
          
          # Copy plugins needed by Qt
          mkdir -p appdir/usr/lib/plugins/platforms
          mkdir -p appdir/usr/lib/plugins/imageformats
          mkdir -p appdir/usr/lib/plugins/iconengines
          cp ${{ env.QT_ROOT_DIR }}/plugins/platforms/libqxcb.so appdir/usr/lib/plugins/platforms/ || echo "libqxcb.so not found"
          cp ${{ env.QT_ROOT_DIR }}/plugins/imageformats/libqjpeg.so appdir/usr/lib/plugins/imageformats/ || echo "JPEG plugin not found"
          cp ${{ env.QT_ROOT_DIR }}/plugins/imageformats/libqsvg.so appdir/usr/lib/plugins/imageformats/ || echo "SVG plugin not found"
          cp ${{ env.QT_ROOT_DIR }}/plugins/iconengines/libqsvgicon.so appdir/usr/lib/plugins/iconengines/ || echo "SVG icon plugin not found"
          
          # Create desktop entry
          cat > appdir/usr/share/applications/control-gui.desktop << EOF
          [Desktop Entry]
          Name=Control GUI
          Exec=Control_GUI
          Icon=control-gui
          Type=Application
          Categories=Utility;
          EOF
          
          # Create a simple placeholder icon
          convert -size 256x256 xc:transparent -fill blue -draw "circle 128,128 128,20" appdir/usr/share/icons/hicolor/256x256/apps/control-gui.png
          
          # Create a launcher script
          cat > appdir/AppRun << EOF
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          export LD_LIBRARY_PATH="\$HERE/usr/lib:\$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="\$HERE/usr/lib/plugins"
          export QML2_IMPORT_PATH="\$HERE/usr/lib/qml"
          export XDG_DATA_DIRS="\$HERE/usr/share:\$XDG_DATA_DIRS"
          "\$HERE/usr/bin/Control_GUI" "\$@"
          EOF
          chmod +x appdir/AppRun
          
          # Create the tar.gz
          cd appdir
          tar -czvf ../../Control_GUI-complete.tar.gz .
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-mqtt-qt-complete
          path: build/Control_GUI-complete.tar.gz
    
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build-failed
          path: build/

  release:
    needs: [build-msvc, build-ubuntu]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/Control_GUI*
          draft: false
          prerelease: false