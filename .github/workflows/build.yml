name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  QT_VERSION: 6.5.3

jobs:
  build-msvc:
    name: Build MSVC
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ runner.os }}

    - uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2019_64
        cache: true
        dir: ${{ github.workspace }}

    - uses: ilammy/msvc-dev-cmd@v1

    - name: Create Third-party Directories
      run: |
        mkdir -p thirdparty/qtmqtt thirdparty/qcustomplot thirdparty/qcgaugewidget/source thirdparty/picojson

    - name: Fetch QCustomPlot
      run: |
        $url = "https://www.qcustomplot.com/release/2.1.1/QCustomPlot-source.tar.gz"
        $output = "$env:GITHUB_WORKSPACE\QCustomPlot.tar.gz"
        Invoke-WebRequest -Uri $url -OutFile $output
        tar -xzf $output -C thirdparty/qcustomplot

    - name: Fetch QCGaugeWidget
      run: |
        git clone https://github.com/ska/Qt-custom-gauge-widget.git --depth 1 thirdparty/qcgaugewidget

    - name: Fetch PicoJSON
      run: |
        git clone https://github.com/kazuho/picojson.git --depth 1 thirdparty/picojson

    - name: Build with CMake
      run: |
        cmake -S . -B build -A x64 `
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" `
          -DCMAKE_INSTALL_PREFIX=install `
          -DBUILD_MQTT_LOCALLY=ON `
          -DCPACK_GENERATOR=WIX
        
        cmake --build build --config Release --target install
        cmake --build build --config Release --target package

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-msvc-mqtt-qt
        path: build/*.msi

    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: msvc-build-failed
        path: build/

  build-ubuntu:
    name: Build Ubuntu
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
    steps:
    - uses: actions/checkout@v4
  
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ runner.os }}
  
    - uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        cache: true
        dir: ${{ github.workspace }}
  
    - name: Install Qt development dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libxkbcommon-dev qt6-base-dev

    - name: Create Third-party Directories
      run: |
        mkdir -p thirdparty/qtmqtt thirdparty/qcustomplot thirdparty/qcgaugewidget/source thirdparty/picojson

    - name: Fetch QCustomPlot
      run: |
        wget https://www.qcustomplot.com/release/2.1.1/QCustomPlot-source.tar.gz
        tar -xzf QCustomPlot-source.tar.gz -C thirdparty/qcustomplot

    - name: Fetch QCGaugeWidget
      run: |
        git clone https://github.com/ska/Qt-custom-gauge-widget.git --depth 1 thirdparty/qcgaugewidget

    - name: Fetch PicoJSON
      run: |
        git clone https://github.com/kazuho/picojson.git --depth 1 thirdparty/picojson
        
    - run: echo "${{ env.QT_ROOT_DIR }}/bin" >> $GITHUB_PATH

    # For Ubuntu, we'll try building with system libraries first, if that fails fall back to building locally
    - name: Build with CMake (using system libraries)
      id: system_build
      continue-on-error: true
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DBUILD_MQTT_LOCALLY=OFF
        cmake --build build

    # If system build fails, try building locally
    - name: Build with CMake (building MQTT locally)
      if: steps.system_build.outcome == 'failure'
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DBUILD_MQTT_LOCALLY=ON
        cmake --build build
  
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-mqtt-qt
        path: build/Control_GUI
  
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-build-failed
        path: build/

  release:
    needs: [build-msvc, build-ubuntu]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.msi
            artifacts/**/Control_GUI*
          draft: false
          prerelease: false