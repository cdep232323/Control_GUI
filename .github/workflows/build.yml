name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  QT_VERSION: 6.5.3

jobs:
  build-msvc:
    name: Build MSVC
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ runner.os }}

    - uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2019_64
        cache: true
        dir: ${{ github.workspace }}

    - uses: ilammy/msvc-dev-cmd@v1

    - name: Check for existing third-party libraries
      run: |
        # Create directories only if they don't exist
        if (!(Test-Path -Path "thirdparty/qtmqtt")) { mkdir -p thirdparty/qtmqtt }
        if (!(Test-Path -Path "thirdparty/qcustomplot")) { mkdir -p thirdparty/qcustomplot }
        if (!(Test-Path -Path "thirdparty/qcgaugewidget/source")) { mkdir -p thirdparty/qcgaugewidget/source }
        if (!(Test-Path -Path "thirdparty/picojson")) { mkdir -p thirdparty/picojson }

    - name: Fetch QCustomPlot if needed
      run: |
        if (!(Test-Path -Path "thirdparty/qcustomplot/qcustomplot.cpp")) {
          $url = "https://www.qcustomplot.com/release/2.1.1/QCustomPlot-source.tar.gz"
          $output = "$env:GITHUB_WORKSPACE\QCustomPlot.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $output
          tar -xzf $output -C thirdparty/qcustomplot
          echo "Downloaded QCustomPlot"
        } else {
          echo "QCustomPlot already exists, skipping download"
        }

    - name: Fetch QCGaugeWidget if needed
      run: |
        if (!(Test-Path -Path "thirdparty/qcgaugewidget/source/qcgaugewidget.cpp")) {
          git clone https://github.com/ska/Qt-custom-gauge-widget.git --depth 1 temp-gauge
          if (!(Test-Path -Path "thirdparty/qcgaugewidget/source")) { mkdir -p thirdparty/qcgaugewidget/source }
          Copy-Item -Path "temp-gauge/source/*" -Destination "thirdparty/qcgaugewidget/source/" -Recurse -Force
          Remove-Item -Path "temp-gauge" -Recurse -Force
          echo "Downloaded QCGaugeWidget"
        } else {
          echo "QCGaugeWidget already exists, skipping download"
        }

    - name: Fetch PicoJSON if needed
      run: |
        if (!(Test-Path -Path "thirdparty/picojson/picojson.h")) {
          git clone https://github.com/kazuho/picojson.git --depth 1 thirdparty/picojson.tmp
          Move-Item -Path "thirdparty/picojson.tmp/*" -Destination "thirdparty/picojson/" -Force
          Remove-Item -Path "thirdparty/picojson.tmp" -Recurse -Force
          echo "Downloaded PicoJSON"
        } else {
          echo "PicoJSON already exists, skipping download"
        }

    - name: Build with CMake
      run: |
        cmake -S . -B build -A x64 `
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" `
          -DCMAKE_INSTALL_PREFIX=install `
          -DBUILD_MQTT_LOCALLY=ON `
          -DCPACK_GENERATOR=WIX
        
        cmake --build build --config Release --target install
        cmake --build build --config Release --target package

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-msvc-mqtt-qt
        path: build/*.msi

    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: msvc-build-failed
        path: build/

  build-ubuntu:
    name: Build Ubuntu
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
    steps:
    - uses: actions/checkout@v4
  
    - uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.job }}-${{ runner.os }}
  
    - uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        cache: true
        dir: ${{ github.workspace }}
  
    - name: Install Qt development dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libxkbcommon-dev qt6-base-dev

    - name: Check for existing third-party libraries
      run: |
        # Create directories only if they don't exist
        [ -d "thirdparty/qtmqtt" ] || mkdir -p thirdparty/qtmqtt
        [ -d "thirdparty/qcustomplot" ] || mkdir -p thirdparty/qcustomplot
        [ -d "thirdparty/qcgaugewidget/source" ] || mkdir -p thirdparty/qcgaugewidget/source
        [ -d "thirdparty/picojson" ] || mkdir -p thirdparty/picojson

    - name: Fetch QCustomPlot if needed
      run: |
        if [ ! -f "thirdparty/qcustomplot/qcustomplot.cpp" ]; then
          wget https://www.qcustomplot.com/release/2.1.1/QCustomPlot-source.tar.gz
          tar -xzf QCustomPlot-source.tar.gz -C thirdparty/qcustomplot
          echo "Downloaded QCustomPlot"
        else
          echo "QCustomPlot already exists, skipping download"
        fi

    - name: Fetch QCGaugeWidget if needed
      run: |
        if [ ! -f "thirdparty/qcgaugewidget/source/qcgaugewidget.cpp" ]; then
          git clone https://github.com/ska/Qt-custom-gauge-widget.git --depth 1 temp-gauge
          mkdir -p thirdparty/qcgaugewidget/source
          cp -r temp-gauge/source/* thirdparty/qcgaugewidget/source/
          rm -rf temp-gauge
          echo "Downloaded QCGaugeWidget"
        else
          echo "QCGaugeWidget already exists, skipping download"
        fi

    - name: Fetch PicoJSON if needed
      run: |
        if [ ! -f "thirdparty/picojson/picojson.h" ]; then
          git clone https://github.com/kazuho/picojson.git --depth 1 thirdparty/picojson.tmp
          cp -r thirdparty/picojson.tmp/* thirdparty/picojson/
          rm -rf thirdparty/picojson.tmp
          echo "Downloaded PicoJSON"
        else
          echo "PicoJSON already exists, skipping download"
        fi
        
    - run: echo "${{ env.QT_ROOT_DIR }}/bin" >> $GITHUB_PATH

    # For Ubuntu, we'll try building with system libraries first, if that fails fall back to building locally
    - name: Build with CMake (using system libraries)
      id: system_build
      continue-on-error: true
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DBUILD_MQTT_LOCALLY=OFF
        cmake --build build

    # If system build fails, try building locally
    - name: Build with CMake (building MQTT locally)
      if: steps.system_build.outcome == 'failure'
      run: |
        cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}" -DBUILD_MQTT_LOCALLY=ON
        cmake --build build
  
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-mqtt-qt
        path: build/Control_GUI
  
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-build-failed
        path: build/

  release:
    needs: [build-msvc, build-ubuntu]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.msi
            artifacts/**/Control_GUI*
          draft: false
          prerelease: false